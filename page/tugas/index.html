<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tugas & Ujian — Kelas VII Bilal bin Rabbah</title>
<meta name="description" content="Daftar tugas dan ujian Kelas VII Bilal bin Rabbah beserta tenggat waktunya.">
<link rel="icon" type="image/png" sizes="32x32" href="../../logo-kelas.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../style.css">
<script>
  (function(){
    var saved = localStorage.getItem("theme");
    var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.setAttribute("data-theme", saved || (prefersDark ? "dark" : "light"));
  })();
</script>
</head>
<body>

<!-- ===== HEADER / NAV ===== -->
<header class="site-header">
  <div class="container header-inner">
    <a href="../../index.html" class="brand">
      <span class="brand-badge" id="brandBadge">VII</span>
      <span class="brand-text">
        <strong>Bilal bin Rabbah</strong>
        <small>SMP Islam Bunga Bangsa</small>
      </span>
    </a>
    <button class="nav-toggle" id="navToggle" aria-label="Buka menu">
      <span></span><span></span><span></span>
    </button>
    <button class="theme-toggle" id="sfxToggle" aria-label="Bisukan/nyalakan efek suara" title="Efek suara">
      <svg class="icon-sfx-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>
      <svg class="icon-sfx-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5Z"/><path d="m17 9 4 6M21 9l-4 6"/></svg>
    </button>
    <button class="theme-toggle" id="bgmToggle" aria-label="Nyalakan/matikan musik latar" title="Musik latar (chiptune)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
    </button>
    <button class="theme-toggle" id="themeToggle" aria-label="Ganti tema gelap/terang" title="Ganti tema">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2M12 19.5v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2.5 12h2M19.5 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/></svg>
    </button>
    <nav class="main-nav" id="mainNav">
      <a href="../../index.html" id="navBeranda" data-nav>Beranda</a>
      <a href="../jadwal/" data-nav>Jadwal</a>
      <a href="../tugas/" data-nav class="active">Tugas &amp; Ujian</a>
      <a href="../kalender/" data-nav>Kalender</a>
      <a href="../siswa/" data-nav>Siswa</a>
      <a href="../galeri/" data-nav>Galeri</a>
      <a href="../saran/" data-nav>Saran</a>
    </nav>
  </div>
</header>

<main>
  <!-- ===== TUGAS & UJIAN ===== -->
  <section class="section">
    <div class="container">
      <div class="section-head">
        <div>
          <p class="eyebrow">Deadline &amp; agenda</p>
          <h2>Daftar Tugas &amp; Ujian</h2>
        </div>
      </div>

      <div class="filter-row" id="filterRow">
        <button class="chip active" data-filter="semua">Semua</button>
        <button class="chip" data-filter="berjalan">Berjalan</button>
        <button class="chip" data-filter="selesai">Selesai</button>
      </div>

      <div class="task-list" id="taskList"></div>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="container">
    <p>Website Kelas VII Bilal bin Rabbah — SMP Islam Bunga Bangsa.</p>
  </div>
</footer>

<div class="toast" id="toast"></div>

<!-- ===== NPC WALI KELAS (bubble chat mengambang) ===== -->
<div class="npc-widget" id="npcWidget">
  <button class="npc-close" id="npcClose" aria-label="Tutup">&times;</button>
  <div class="npc-bubble" id="npcBubble">Memuat pesan...</div>
  <div class="npc-avatar" id="npcAvatar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
  </div>
</div>

<script src="../../sound.js"></script>
<script src="../../app.js"></script>
</body>
</html>
