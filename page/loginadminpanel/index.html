<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Admin — Kelas VII Bilal bin Rabbah</title>
  <link rel="stylesheet" href="../../style.css">
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #f4f6f9;
      margin: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .login-card {
      background: #ffffff;
      padding: 2.5rem;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      width: 100%;
      max-width: 400px;
    }
    .login-card h2 {
      margin-top: 0;
      margin-bottom: 0.5rem;
      color: #1e293b;
    }
    .login-card p {
      color: #64748b;
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
    }
    .form-group {
      margin-bottom: 1.2rem;
    }
    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 600;
      color: #334155;
    }
    .form-group input {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1.5px solid #cbd5e1;
      border-radius: 8px;
      font-size: 1rem;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-group input:focus {
      border-color: #2563eb;
    }
    .btn-login {
      width: 100%;
      padding: 0.8rem;
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-login:hover {
      background-color: #1d4ed8;
    }
    .error-message {
      color: #dc2626;
      font-size: 0.85rem;
      margin-top: 0.5rem;
      display: none;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <h2>Admin Login</h2>
    <p>Masuk untuk mengelola web kelas</p>
    
    <form id="loginForm">
      <div class="form-group">
        <label for="password">Password Admin</label>
        <input type="password" id="password" placeholder="Masukkan password..." required>
        <div class="error-message" id="errorMsg">Password yang kamu masukkan salah!</div>
      </div>
      <button type="submit" class="btn-login" id="submitBtn">Masuk</button>
    </form>
  </div>

  <script src="login.js"></script>
</body>
</html>
