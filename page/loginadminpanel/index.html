<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Admin — Kelas VII Bilal bin Rabbah</title>
  <link rel="icon" type="image/png" sizes="32x32" href="../../logo-kelas.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Atkinson+Hyperlegible+Next:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../style.css">
  <script>
    (function(){
      var saved = localStorage.getItem("theme");
      var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.setAttribute("data-theme", saved || (prefersDark ? "dark" : "light"));
    })();
  </script>
  <style>
    body{
      display:flex; justify-content:center; align-items:center;
      min-height:100vh; background: var(--surface-bg); margin:0; padding:1.5rem;
    }
    .login-wrap{ width:100%; max-width:400px; }
    .login-card{
      background: var(--surface); border:1px solid var(--outline);
      padding: 2.25rem 2rem; border-radius: var(--radius-lg);
      box-shadow: var(--shadow-pop);
    }
    .login-top{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:1.25rem; }
    .login-icon{
      width:44px; height:44px;
      background: var(--primary); color:#fff;
      display:flex; align-items:center; justify-content:center;
      clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
    }
    .login-icon svg{ width:20px; height:20px; }
    .login-card h2{ margin: 0 0 0.35rem; color: var(--on-surface); font-size:1.35rem; font-weight:600; }
    .login-card > p{ color: var(--on-surface-variant); font-size:0.9rem; margin-bottom:1.5rem; }
    .password-field{ position:relative; }
    .password-field input{
      width:100%; padding: 0.75rem 2.75rem 0.75rem 1rem;
      border:1.5px solid var(--outline); border-radius: var(--radius-sm);
      font-size:1rem; box-sizing:border-box; outline:none;
      background: var(--surface-bg); color: var(--on-surface);
      transition: border-color .2s;
    }
    .password-field input:focus{ border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-tint); }
    .toggle-password{
      position:absolute; right:0.6rem; top:50%; transform:translateY(-50%);
      background:none; border:none; color: var(--on-surface-variant);
      padding:4px; display:flex;
    }
    .toggle-password svg{ width:19px; height:19px; }
    .btn-login{
      width:100%; padding:0.8rem; margin-top:0.3rem;
      background: var(--primary); color:#fff; border:none; border-radius: var(--radius-sm);
      font-weight:600; font-size:1rem; cursor:pointer; transition: background .2s;
      font-family: var(--font-display);
    }
    .btn-login:hover{ background: var(--primary-dark); }
    .btn-login:disabled{ opacity:0.6; cursor:not-allowed; }
    .error-message{ color: var(--deadline-red); font-size:0.85rem; margin-top:0.6rem; display:none; }
    .lockout-banner{
      display:none; background: rgba(214,69,69,0.1); border:1px solid rgba(214,69,69,0.3);
      color: var(--deadline-red); font-size:0.85rem; font-weight:600; padding:0.7rem 0.9rem;
      border-radius: var(--radius-sm); margin-bottom:1rem;
    }
    .field-hint{ font-size:0.78rem; color: var(--on-surface-variant); margin-top:1.1rem; text-align:center; }
  </style>
</head>
<body>

  <div class="login-wrap">
    <div class="login-card">
      <div class="login-top">
        <span class="login-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
        </span>
        <button class="theme-toggle" id="themeToggle" aria-label="Ganti tema" title="Ganti tema">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2M12 19.5v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2.5 12h2M19.5 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/></svg>
        </button>
      </div>
      <h2>Admin Login</h2>
      <p>Masuk untuk mengelola website kelas</p>

      <div class="lockout-banner" id="lockoutBanner"></div>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="password">Password Admin</label>
          <div class="password-field">
            <input type="password" id="password" placeholder="Masukkan password..." autocomplete="current-password" required>
            <button type="button" class="toggle-password" id="togglePassword" aria-label="Tampilkan password">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 12S5 5 12 5s10.5 7 10.5 7-3.5 7-10.5 7S1.5 12 1.5 12Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <div class="error-message" id="errorMsg">Password yang kamu masukkan salah.</div>
        </div>
        <button type="submit" class="btn-login" id="submitBtn">Masuk</button>
      </form>
      <p class="field-hint">Hubungi wali kelas jika lupa password admin.</p>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <!-- Firebase Client SDK (untuk mencatat log aktivitas login) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="../../firebase-config.js"></script>
  <script src="login.js"></script>
</body>
</html>
