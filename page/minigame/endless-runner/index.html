<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Endless Runner — Kelas VII Bilal</title>
    <link rel="stylesheet" href="../../style.css">
    <style>
        body { margin: 0; overflow: hidden; background: var(--surface); font-family: var(--font-display); }
        #game-container { position: relative; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; flex-direction: column; }
        canvas { background: var(--card); border: 4px solid var(--pixel-ink); box-shadow: var(--shadow-card); max-width: 100%; max-height: 80vh; }
        .ui-overlay { position: absolute; top: 20px; left: 20px; color: var(--foreground); pointer-events: none; }
        .score { font-size: 2rem; font-weight: bold; text-shadow: 2px 2px 0 var(--pixel-ink); }
        .menu { position: absolute; background: var(--surface); border: 4px solid var(--pixel-ink); padding: 2rem; text-align: center; box-shadow: var(--shadow-card); z-index: 10; }
        .menu h2 { margin-top: 0; text-transform: uppercase; }
        .btn-start { padding: 0.8rem 2rem; font-size: 1.2rem; cursor: pointer; background: var(--accent); color: white; border: 3px solid var(--pixel-ink); font-family: var(--font-display); font-weight: bold; transition: transform 0.1s; }
        .btn-start:active { transform: scale(0.95); }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div id="game-container">
        <div class="ui-overlay">
            <div class="score">SKOR: <span id="scoreVal">0</span></div>
        </div>

        <canvas id="gameCanvas"></canvas>

        <div id="startMenu" class="menu">
            <h2>Endless Runner</h2>
            <p>Lompati rintangan! <br> Tekan <b>SPASI</b> atau <b>KLIK/TAP</b> untuk melompat.</p>
            <button class="btn-start" id="startBtn">MULAI MAIN</button>
        </div>

        <div id="gameOverMenu" class="menu hidden">
            <h2>GAME OVER!</h2>
            <p>Skor Akhir: <span id="finalScore">0</span></p>
            <button class="btn-start" id="restartBtn">COBA LAGI</button>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
