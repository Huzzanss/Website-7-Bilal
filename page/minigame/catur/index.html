<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catur — Kelas VII Bilal</title>
    <link rel="stylesheet" href="../../style.css">
    <style>
        body { background: var(--surface); font-family: var(--font-display); margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: var(--foreground); }
        .game-container { width: 100%; max-width: 900px; padding: 20px; text-align: center; }
        .menu-card { background: var(--card); border: 4px solid var(--pixel-ink); padding: 2rem; box-shadow: var(--shadow-card); max-width: 400px; margin: 0 auto; }
        .hidden { display: none; }
        .btn-group { display: flex; flex-direction: column; gap: 1rem; margin-top: 2rem; }
        .btn-game { padding: 1rem; background: var(--accent); color: white; border: 3px solid var(--pixel-ink); font-weight: bold; cursor: pointer; text-transform: uppercase; transition: 0.1s; }
        .btn-game:active { transform: scale(0.95); }
        .board-container { display: none; flex-direction: column; align-items: center; }
        #chessBoard { display: grid; grid-template-columns: repeat(8, 50px); grid-template-rows: repeat(8, 50px); border: 4px solid var(--pixel-ink); }
        .square { width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; cursor: pointer; }
        .white { background: #eeeed2; color: #000; }
        .black { background: #769656; color: #000; }
        .selected { background: #bbc84b !important; }
    </style>
</head>
<body>
    <div class="game-container">
        <!-- Main Menu -->
        <div id="mainMenu" class="menu-card">
            <h2>Catur VII Bilal</h2>
            <p>Pilih Mode Permainan</p>
            <div class="btn-group">
                <button class="btn-game" onclick="showMenu('soloMenu')">Solo vs AI</button>
                <button class="btn-game" onclick="showMenu('multiMenu')">Multiplayer</button>
            </div>
        </div>

        <!-- Solo Menu -->
        <div id="soloMenu" class="menu-card hidden">
            <h2>Solo Mode</h2>
            <p>Bermain melawan komputer.</p>
            <div class="btn-group">
                <button class="btn-game" onclick="startGame('solo')">Mulai Permainan</button>
                <button class="btn-game" onclick="showMenu('mainMenu')">Kembali</button>
            </div>
        </div>

        <!-- Multiplayer Menu -->
        <div id="multiMenu" class="menu-card hidden">
            <h2>Multiplayer</h2>
            <p>Bermain dengan teman.</p>
            <div class="btn-group">
                <button class="btn-game" onclick="showMenu('roomMenu')">Lobby Room</button>
                <button class="btn-game" onclick="showMenu('mainMenu')">Kembali</button>
            </div>
        </div>

        <!-- Room Menu -->
        <div id="roomMenu" class="menu-card hidden">
            <h2>Lobby Room</h2>
            <div class="btn-group">
                <button class="btn-game" onclick="alert('Membuat room...')">Buat Room</button>
                <button class="btn-game" onclick="alert('Join room...')">Join Room</button>
                <button class="btn-game" onclick="showMenu('multiMenu')">Kembali</button>
            </div>
        </div>

        <!-- Game Board -->
        <div id="gameBoard" class="board-container">
            <div id="chessBoard"></div>
            <div style="margin-top: 20px;">
                <p id="turnInfo">Giliran: Putih</p>
                <button class="btn-game" onclick="location.reload()">Kalah/Serah</button>
            </div>
        </div>
    </div>

    <script>
        function showMenu(menuId) {
            document.querySelectorAll('.menu-card').forEach(m => m.classList.add('hidden'));
            document.getElementById(menuId).classList.remove('hidden');
        }

        function startGame(mode) {
            document.querySelectorAll('.menu-card').forEach(m => m.classList.add('hidden'));
            document.getElementById('gameBoard').style.display = 'flex';
            initBoard();
        }

        function initBoard() {
            const board = document.getElementById('chessBoard');
            const pieces = {
                'r': '♜', 'n': '♞', 'b': '♝', 'q': '♛', 'k': '♚', 'p': '♟',
                'R': '♖', 'N': '♘', 'B': '♗', 'Q': '♕', 'K': '♔', 'P': '♙'
            };
            const layout = [
                ['r','n','b','q','k','b','n','r'],
                ['p','p','p','p','p','p','p','p'],
                ['','','','','','','',''],
                ['','','','','','','',''],
                ['','','','','','','',''],
                ['','','','','','','',''],
                ['P','P','P','P','P','P','P','P'],
                ['R','N','B','Q','K','B','N','R']
            ];

            for(let r=0; r<8; r++) {
                for(let c=0; c<8; c++) {
                    const sq = document.createElement('div');
                    sq.classList.add('square');
                    sq.classList.add((r+c)%2===0 ? 'white' : 'black');
                    sq.textContent = pieces[layout[r][c]] || '';
                    sq.onclick = () => {
                        document.querySelectorAll('.square').forEach(s => s.classList.remove('selected'));
                        sq.classList.add('selected');
                    };
                    board.appendChild(sq);
                }
            }
        }
    </script>
</body>
</html>
