<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel — Kelas VII Bilal bin Rabbah</title>
  <link rel="icon" type="image/png" sizes="32x32" href="../../logo-kelas.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Atkinson+Hyperlegible+Next:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../style.css">
  <style>
    /* Admin Panel Custom Styles */
    .admin-card {
      background: #ffffff;
      border: 1px solid var(--outline, #D8DFEA);
      border-radius: var(--radius-lg, 1rem);
      padding: 1.1rem;
      box-shadow: var(--shadow-card, 0 4px 12px rgba(11, 28, 48, 0.06));
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
      margin-bottom: 0.8rem;
    }

    .btn-danger-sm {
      background: #FEE2E2;
      color: #DC2626;
      border: 1px solid #FCA5A5;
      padding: 0.35rem 0.65rem;
      border-radius: var(--radius-sm, 0.5rem);
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
    }
    .btn-danger-sm:hover {
      background: #DC2626;
      color: #FFFFFF;
    }

    .admin-gallery-card {
      position: relative;
      aspect-ratio: 1/1;
      border-radius: var(--radius-md, 0.75rem);
      overflow: hidden;
      border: 1px solid var(--outline, #D8DFEA);
      background: #fff;
    }
    .admin-gallery-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .admin-gallery-card .btn-delete-img {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(220, 38, 38, 0.9);
      color: white;
      border: none;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }

    .action-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header class="site-header">
    <div class="container header-inner">
      <a href="../../index.html" class="brand">
        <span class="brand-badge">VII</span>
        <span class="brand-text">
          <strong>Admin Panel</strong>
          <small>Kelas VII Bilal bin Rabbah</small>
        </span>
      </a>
      <div style="display: flex; gap: 0.5rem; align-items: center;">
        <a href="../../index.html" class="btn btn-secondary" style="font-size: 0.82rem;">← Web Utama</a>
        <button id="logoutBtn" class="btn btn-primary" style="background: #DC2626; border-color: #DC2626; font-size: 0.82rem;">Keluar Admin</button>
      </div>
    </div>
  </header>

  <!-- MAIN CONTENT -->
  <main class="container" style="padding-top: 2rem; padding-bottom: 4rem;">

    <!-- PENGUMUMAN -->
    <section class="section" style="padding: 1rem 0 2rem;">
      <div class="section-head">
        <div>
          <p class="eyebrow">Manajemen Informasi</p>
          <h2>Pengumuman Kelas</h2>
        </div>
        <button id="addAnnouncementBtn" class="btn btn-primary">+ Buat Pengumuman</button>
      </div>
      <div class="announcement-list" id="adminAnnouncementList">
        <p class="empty-note">Memuat data pengumuman...</p>
      </div>
    </section>

    <!-- TUGAS & UJIAN -->
    <section class="section" style="padding: 2rem 0;">
      <div class="section-head">
        <div>
          <p class="eyebrow">Manajemen Agenda</p>
          <h2>Daftar Tugas &amp; Ujian</h2>
        </div>
        <button id="addTaskBtn" class="btn btn-primary">+ Tambah Tugas</button>
      </div>
      <div class="task-list" id="adminTaskList">
        <p class="empty-note">Memuat data tugas...</p>
      </div>
    </section>

    <!-- GALERI -->
    <section class="section" style="padding: 2rem 0;">
      <div class="section-head">
        <div>
          <p class="eyebrow">Manajemen Media</p>
          <h2>Galeri Foto Kelas</h2>
        </div>
        <button id="addGalleryBtn" class="btn btn-primary">+ Tambah Foto</button>
      </div>
      <div class="gallery-grid" id="adminGalleryGrid">
        <div class="gallery-empty">Memuat galeri...</div>
      </div>
    </section>

  </main>

  <div class="toast" id="toast"></div>

  <!-- Firebase Client SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="../../firebase-config.js"></script>

  <!-- ADMIN LOGIC SCRIPT (DIRECT INTEGRATION) -->
  <script>
    // 1. UTILITY FUNCTIONS
    function escapeHTML(str) {
      if (!str) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function escapeAttr(str) {
      if (!str) return "";
      return String(str).replace(/"/g, "&quot;");
    }

    function showToast(message) {
      const toast = document.getElementById("toast");
      if (!toast) return;
      toast.textContent = message;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 3000);
    }

    // 2. AUTHENTICATION & SESSION
    function checkAuth() {
      const isLoggedIn = sessionStorage.getItem("adminLoggedIn");
      if (!isLoggedIn || isLoggedIn !== "true") {
        alert("Akses ditolak! Silakan login terlebih dahulu.");
        window.location.href = "../../index.html";
        return false;
      }
      return true;
    }

    function logoutAdmin(message) {
      sessionStorage.removeItem("adminLoggedIn");
      if (message) alert(message);
      window.location.href = "../../index.html";
    }

    // Auto Logout Inactivity (15 Menit)
    const INACTIVE_TIMEOUT = 15 * 60 * 1000;
    let inactivityTimer;

    function resetInactivityTimer() {
      clearTimeout(inactivityTimer);
      inactivityTimer = setTimeout(() => {
        logoutAdmin("Sesi berakhir karena tidak ada aktivitas selama 15 menit.");
      }, INACTIVE_TIMEOUT);
    }

    ['mousemove', 'keydown', 'click', 'scroll'].forEach(evt => {
      window.addEventListener(evt, resetInactivityTimer);
    });

    // 3. GLOBAL STORAGE & RENDERERS
    let dbAnnouncements = [];
    let dbTasks = [];
    let dbGallery = [];

    function renderAnnouncements() {
      const list = document.getElementById("adminAnnouncementList");
      if (!list) return;

      if (!dbAnnouncements || !dbAnnouncements.length) {
        list.innerHTML = `<p class="empty-note">Belum ada pengumuman.</p>`;
        return;
      }

      list.innerHTML = dbAnnouncements.map(a => `
        <div class="admin-card">
          <div>
            <strong style="font-family: var(--font-display, sans-serif); font-size: 1rem; color: var(--on-surface, #000); display: block; margin-bottom: 0.3rem;">${escapeHTML(a.title)}</strong>
            <p style="color: var(--on-surface-variant, #555); font-size: 0.9rem; margin-bottom: 0.5rem;">${escapeHTML(a.body || "")}</p>
            <span style="font-size: 0.75rem; color: var(--on-surface-variant, #777); font-weight: 600;">${escapeHTML(a.date || "")}</span>
          </div>
          <button class="btn-danger-sm" onclick="deleteAnnouncement('${a.id}')">Hapus</button>
        </div>
      `).join("");
    }

    function renderTasks() {
      const list = document.getElementById("adminTaskList");
      if (!list) return;

      if (!dbTasks || !dbTasks.length) {
        list.innerHTML = `<p class="empty-note">Belum ada tugas/ujian.</p>`;
        return;
      }

      list.innerHTML = dbTasks.map(t => `
        <div class="task-card">
          <div class="task-top">
            <span class="task-subject">${escapeHTML(t.subject)}</span>
            <span class="status-pill ${t.status}">${t.status === "selesai" ? "Selesai" : "Berjalan"}</span>
          </div>
          <div class="task-title">${escapeHTML(t.title)}</div>
          <div class="task-desc">${escapeHTML(t.desc || "")}</div>
          <div class="task-foot">
            <span class="deadline">Tenggat: ${escapeHTML(t.deadline || "")}</span>
            <div class="action-group">
              <button class="btn btn-secondary" style="min-height:32px; padding: 0.3rem 0.6rem; font-size: 0.78rem;" onclick="toggleTaskStatus('${t.id}', '${t.status}')">
                ${t.status === "selesai" ? "Buka Lagi" : "Tandai Selesai"}
              </button>
              <button class="btn-danger-sm" onclick="deleteTask('${t.id}')">Hapus</button>
            </div>
          </div>
        </div>
      `).join("");
    }

    function renderGallery() {
      const grid = document.getElementById("adminGalleryGrid");
      if (!grid) return;

      if (!dbGallery || !dbGallery.length) {
        grid.innerHTML = `<div class="gallery-empty">Belum ada foto kegiatan.</div>`;
        return;
      }

      grid.innerHTML = dbGallery.map(g => `
        <div class="admin-gallery-card">
          <img src="${escapeAttr(g.url)}" alt="Dokumentasi kelas" loading="lazy">
          <button class="btn-delete-img" onclick="deleteGalleryItem('${g.id}')">&times;</button>
        </div>
      `).join("");
    }

    // 4. FIREBASE INITIALIZATION
    function initFirebaseData() {
      if (typeof firebase === "undefined" || !firebase.apps || !firebase.apps.length) {
        console.error("Firebase tidak ditemukan. Periksa "../../firebase-config.js"");
        renderAnnouncements();
        renderTasks();
        renderGallery();
        return;
      }

      const db = firebase.database();

      // Listener Pengumuman
      db.ref("announcements").on("value", snapshot => {
        const data = snapshot.val() || {};
        dbAnnouncements = Object.keys(data).map(key => ({ id: key, ...data[key] }));
        renderAnnouncements();
      });

      // Listener Tugas
      db.ref("tasks").on("value", snapshot => {
        const data = snapshot.val() || {};
        dbTasks = Object.keys(data).map(key => ({ id: key, ...data[key] }));
        renderTasks();
      });

      // Listener Galeri
      db.ref("gallery").on("value", snapshot => {
        const data = snapshot.val() || {};
        dbGallery = Object.keys(data).map(key => ({ id: key, ...data[key] }));
        renderGallery();
      });
    }

    // 5. ACTIONS
    function deleteAnnouncement(id) {
      if (confirm("Hapus pengumuman ini?")) {
        firebase.database().ref("announcements/" + id).remove()
          .then(() => showToast("Pengumuman berhasil dihapus"));
      }
    }

    function deleteTask(id) {
      if (confirm("Hapus tugas ini?")) {
        firebase.database().ref("tasks/" + id).remove()
          .then(() => showToast("Tugas berhasil dihapus"));
      }
    }

    function toggleTaskStatus(id, currentStatus) {
      const newStatus = currentStatus === "selesai" ? "berjalan" : "selesai";
      firebase.database().ref("tasks/" + id).update({ status: newStatus })
        .then(() => showToast("Status tugas diperbarui"));
    }

    function deleteGalleryItem(id) {
      if (confirm("Hapus foto ini dari galeri?")) {
        firebase.database().ref("gallery/" + id).remove()
          .then(() => showToast("Foto berhasil dihapus"));
      }
    }

    // 6. INITIAL SETUP
    document.addEventListener("DOMContentLoaded", () => {
      // Verifikasi Auth Login
      if (!checkAuth()) return;

      // Start timer inaktivitas
      resetInactivityTimer();

      // Logout Button
      const logoutBtn = document.getElementById("logoutBtn");
      if (logoutBtn) {
        logoutBtn.addEventListener("click", () => logoutAdmin("Berhasil keluar."));
      }

      // Tombol Buat Pengumuman
      const addAnnBtn = document.getElementById("addAnnouncementBtn");
      if (addAnnBtn) {
        addAnnBtn.addEventListener("click", () => {
          const title = prompt("Masukkan Judul Pengumuman:");
          if (!title) return;
          const body = prompt("Masukkan Isi Pengumuman:");
          const date = new Date().toLocaleDateString("id-ID", { day: 'numeric', month: 'short', year: 'numeric' });

          if (typeof firebase !== "undefined" && firebase.apps.length) {
            firebase.database().ref("announcements").push({ title, body, date })
              .then(() => showToast("Pengumuman berhasil dibuat!"));
          }
        });
      }

      // Tombol Tambah Tugas
      const addTaskBtn = document.getElementById("addTaskBtn");
      if (addTaskBtn) {
        addTaskBtn.addEventListener("click", () => {
          const subject = prompt("Mata Pelajaran (contoh: PKN, MTK):");
          if (!subject) return;
          const title = prompt("Judul Tugas/Ujian:");
          const desc = prompt("Deskripsi Ringkas:");
          const deadline = prompt("Tenggat Waktu (contoh: 2026-07-31):");

          if (typeof firebase !== "undefined" && firebase.apps.length) {
            firebase.database().ref("tasks").push({
              subject, title, desc, deadline, status: "berjalan"
            }).then(() => showToast("Tugas berhasil ditambahkan!"));
          }
        });
      }

      // Tombol Tambah Foto
      const addGalBtn = document.getElementById("addGalleryBtn");
      if (addGalBtn) {
        addGalBtn.addEventListener("click", () => {
          const url = prompt("Masukkan URL Gambar/Foto:");
          if (!url) return;

          if (typeof firebase !== "undefined" && firebase.apps.length) {
            firebase.database().ref("gallery").push({ url })
              .then(() => showToast("Foto berhasil ditambahkan!"));
          }
        });
      }

      // Load data Firebase
      initFirebaseData();
    });
  </script>
</body>
</html>
