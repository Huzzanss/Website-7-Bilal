<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel — Kelas VII Bilal bin Rabbah</title>
  <link rel="icon" type="image/png" sizes="32x32" href="../../logo-kelas.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Atkinson+Hyperlegible+Next:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../style.css">
  <style>
    /* Admin Panel Layout Tweaks */
    .admin-card {
      background: #ffffff;
      border: 1px solid var(--outline, #D8DFEA);
      border-radius: var(--radius-lg, 1rem);
      padding: 1.1rem;
      box-shadow: var(--shadow-card, 0 4px 12px rgba(11, 28, 48, 0.06));
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
      margin-bottom: 0.8rem;
    }

    .btn-danger-sm {
      background: #FEE2E2;
      color: #DC2626;
      border: 1px solid #FCA5A5;
      padding: 0.35rem 0.65rem;
      border-radius: var(--radius-sm, 0.5rem);
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
    }
    .btn-danger-sm:hover {
      background: #DC2626;
      color: #FFFFFF;
    }

    .admin-gallery-card {
      position: relative;
      aspect-ratio: 1/1;
      border-radius: var(--radius-md, 0.75rem);
      overflow: hidden;
      border: 1px solid var(--outline, #D8DFEA);
      background: #fff;
    }
    .admin-gallery-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .admin-gallery-card .btn-delete-img {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(220, 38, 38, 0.9);
      color: white;
      border: none;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }

    .action-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header class="site-header">
    <div class="container header-inner">
      <a href="../../index.html" class="brand">
        <span class="brand-badge">VII</span>
        <span class="brand-text">
          <strong>Admin Panel</strong>
          <small>Kelas VII Bilal bin Rabbah</small>
        </span>
      </a>
      <div style="display: flex; gap: 0.5rem; align-items: center;">
        <a href="../../index.html" class="btn btn-secondary" style="font-size: 0.82rem;">← Web Utama</a>
        <button id="logoutBtn" class="btn btn-primary" style="background: #DC2626; border-color: #DC2626; font-size: 0.82rem;">Keluar Admin</button>
      </div>
    </div>
  </header>

  <!-- MAIN CONTENT -->
  <main class="container" style="padding-top: 2rem; padding-bottom: 4rem;">

    <!-- PENGUMUMAN -->
    <section class="section" style="padding: 1rem 0 2rem;">
      <div class="section-head">
        <div>
          <p class="eyebrow">Manajemen Informasi</p>
          <h2>Pengumuman Kelas</h2>
        </div>
        <button id="addAnnouncementBtn" class="btn btn-primary">+ Buat Pengumuman</button>
      </div>
      <div class="announcement-list" id="adminAnnouncementList">
        <p class="empty-note">Memuat data pengumuman...</p>
      </div>
    </section>

    <!-- TUGAS & UJIAN -->
    <section class="section" style="padding: 2rem 0;">
      <div class="section-head">
        <div>
          <p class="eyebrow">Manajemen Agenda</p>
          <h2>Daftar Tugas &amp; Ujian</h2>
        </div>
        <button id="addTaskBtn" class="btn btn-primary">+ Tambah Tugas</button>
      </div>
      <div class="task-list" id="adminTaskList">
        <p class="empty-note">Memuat data tugas...</p>
      </div>
    </section>

    <!-- GALERI -->
    <section class="section" style="padding: 2rem 0;">
      <div class="section-head">
        <div>
          <p class="eyebrow">Manajemen Media</p>
          <h2>Galeri Foto Kelas</h2>
        </div>
        <button id="addGalleryBtn" class="btn btn-primary">+ Tambah Foto</button>
      </div>
      <div class="gallery-grid" id="adminGalleryGrid">
        <div class="gallery-empty">Memuat galeri...</div>
      </div>
    </section>

  </main>

  <div class="toast" id="toast"></div>

  <!-- Firebase Client SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="../../firebase-config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
