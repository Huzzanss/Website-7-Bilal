<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel — Kelas VII Bilal bin Rabbah</title>
<link rel="icon" type="image/png" sizes="32x32" href="logo-kelas.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Atkinson+Hyperlegible+Next:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Header Admin -->
<header class="site-header">
  <div class="container header-inner">
    <a href="index.html" class="brand">
      <span class="brand-badge" id="brandBadge">VII</span>
      <span class="brand-text">
        <strong>Admin Panel</strong>
        <small>Kelas VII Bilal bin Rabbah</small>
      </span>
    </a>
    <div style="display: flex; gap: 0.5rem; align-items: center;">
      <a href="index.html" class="btn btn-secondary">← Kembali ke Web Utama</a>
      <button class="btn btn-primary" id="btnLogout" style="display:none;">Keluar Admin</button>
    </div>
  </div>
</header>

<main class="container" id="adminContent" style="padding-top: 2rem; display: none;">

  <!-- KELOLA PENGUMUMAN -->
  <section class="section">
    <div class="section-head">
      <div>
        <p class="eyebrow">Manajemen Informasi</p>
        <h2>Pengumuman Kelas</h2>
      </div>
      <button class="btn btn-primary" id="btnAddAnnouncement">+ Buat Pengumuman</button>
    </div>
    <div class="announcement-board">
      <div class="announcement-list" id="announcementList"></div>
    </div>
  </section>

  <!-- KELOLA TUGAS -->
  <section class="section alt-bg" style="border-radius: var(--radius-lg); padding: 1.5rem; margin-bottom: 2rem;">
    <div class="section-head">
      <div>
        <p class="eyebrow">Manajemen Agenda</p>
        <h2>Daftar Tugas & Ujian</h2>
      </div>
      <button class="btn btn-primary" id="btnAddTask">+ Tambah Tugas</button>
    </div>
    <div class="task-list" id="taskList"></div>
  </section>

  <!-- KELOLA GALERI FOTO -->
  <section class="section">
    <div class="section-head">
      <div>
        <p class="eyebrow">Manajemen Dokumentasi</p>
        <h2>Galeri Foto Kelas</h2>
      </div>
      <label class="btn btn-primary btn-upload">
        + Unggah Foto
        <input type="file" id="galleryInput" accept="image/*" multiple hidden>
      </label>
    </div>
    <div class="gallery-grid" id="galleryGrid"></div>
  </section>

</main>

<!-- MODAL LOGIN ADMIN -->
<div class="modal-backdrop" id="loginModal">
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modal-head">
      <h3>Login Admin</h3>
    </div>
    <div class="modal-body">
      <form id="loginForm">
        <div class="form-group">
          <label for="adminUsername">Username</label>
          <input type="text" id="adminUsername" required placeholder="Masukkan username">
        </div>
        <div class="form-group">
          <label for="adminPassword">Password</label>
          <input type="password" id="adminPassword" required placeholder="Masukkan password">
        </div>
        <div class="modal-actions">
          <a href="index.html" class="btn btn-secondary" style="text-align: center;">Batal</a>
          <button type="submit" class="btn btn-primary">Masuk</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- MODAL UMUM (Pengumuman & Tugas) -->
<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modal-head">
      <h3 id="modalTitle">Judul</h3>
      <button class="modal-close" id="modalClose" aria-label="Tutup">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="admin.js"></script>
</body>
</html>
